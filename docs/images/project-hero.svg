<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" role="img" aria-labelledby="title desc">
  <title id="title">MCP Server Decisions - Architectural Decision Governance</title>
  <desc id="desc">Rede neural de agentes MCP com rastreamento de decisões arquiteturais e outcome gates</desc>
  <style>
    :root{ --bg:#090d16; --purple:#a855f7; --cyan:#38bdf8; --green:#10b981; --red:#ef4444; --ink:#faf5ff; --sub:#e9d5ff; }
    *{transform-box:fill-box;}
    @keyframes synapseFlow {
      0% { stroke-dashoffset: 200; }
      100% { stroke-dashoffset: 0; }
    }
    .synapse {
      stroke-dasharray: 200;
      animation: synapseFlow 2s linear infinite;
    }
    @keyframes nodePulse {
      0%, 100% { transform: scale(1); opacity: 0.8; }
      50% { transform: scale(1.15); opacity: 1; }
    }
    .mcpNode { animation: nodePulse 2.5s ease-in-out infinite; }
  </style>
  <rect width="800" height="360" fill="var(--bg)" rx="12"/>
  <g stroke="#3b0764" stroke-width="2">
    <line x1="140" y1="120" x2="300" y2="180"/>
    <line x1="140" y1="240" x2="300" y2="180"/>
    <line x1="300" y1="180" x2="500" y2="120"/>
    <line x1="300" y1="180" x2="500" y2="240"/>
    <line x1="500" y1="120" x2="680" y2="180"/>
    <line x1="500" y1="240" x2="680" y2="180"/>
  </g>
  <g fill="none" stroke="var(--purple)" stroke-width="2.5">
    <path class="synapse" d="M 140,120 L 300,180 L 500,120 L 680,180"/>
    <path class="synapse" d="M 140,240 L 300,180 L 500,240 L 680,180" style="animation-delay:1s;"/>
  </g>
  <g class="mcpNode" transform="translate(140, 120)">
    <circle r="28" fill="#581c87" stroke="var(--purple)" stroke-width="2"/>
    <text x="0" y="4" font-size="10" font-weight="900" fill="var(--ink)" text-anchor="middle" font-family="system-ui">PREDICT</text>
  </g>
  <g class="mcpNode" transform="translate(140, 240)" style="animation-delay:0.5s;">
    <circle r="28" fill="#581c87" stroke="var(--purple)" stroke-width="2"/>
    <text x="0" y="4" font-size="10" font-weight="900" fill="var(--ink)" text-anchor="middle" font-family="system-ui">AUDIT</text>
  </g>
  <g class="mcpNode" transform="translate(300, 180)" style="animation-delay:0.8s;">
    <circle r="36" fill="#3b0764" stroke="var(--cyan)" stroke-width="3"/>
    <text x="0" y="-4" font-size="11" font-weight="900" fill="var(--cyan)" text-anchor="middle" font-family="system-ui">MCP</text>
    <text x="0" y="10" font-size="9" font-weight="700" fill="var(--sub)" text-anchor="middle" font-family="system-ui">SERVER</text>
  </g>
  <g class="mcpNode" transform="translate(500, 120)" style="animation-delay:1.2s;">
    <circle r="28" fill="#065f46" stroke="var(--green)" stroke-width="2"/>
    <text x="0" y="4" font-size="10" font-weight="900" fill="#a7f3d0" text-anchor="middle" font-family="system-ui">GATE</text>
  </g>
  <g class="mcpNode" transform="translate(500, 240)" style="animation-delay:1.5s;">
    <circle r="28" fill="#1e3a8a" stroke="var(--cyan)" stroke-width="2"/>
    <text x="0" y="4" font-size="10" font-weight="900" fill="var(--cyan)" text-anchor="middle" font-family="system-ui">MEMORY</text>
  </g>
  <g transform="translate(620, 140)">
    <rect x="0" y="0" width="140" height="80" rx="8" fill="#064e3b" stroke="var(--green)" stroke-width="1.5"/>
    <text x="70" y="24" font-size="10" font-weight="700" fill="#a7f3d0" text-anchor="middle" font-family="system-ui">OUTCOME GATE</text>
    <text x="70" y="48" font-size="12" font-weight="900" fill="var(--green)" text-anchor="middle" font-family="system-ui">✓ VALIDATED</text>
    <text x="70" y="66" font-size="9" fill="var(--ink)" text-anchor="middle" font-family="system-ui">Variance &lt; 5%</text>
  </g>
  <g transform="translate(260, 25)">
    <rect x="0" y="0" width="280" height="40" rx="6" fill="#3b0764" stroke="var(--purple)" stroke-width="1"/>
    <text x="140" y="25" font-size="12" font-weight="900" fill="var(--ink)" text-anchor="middle" font-family="system-ui">MODEL CONTEXT PROTOCOL DECISION ENGINE</text>
  </g>
</svg>